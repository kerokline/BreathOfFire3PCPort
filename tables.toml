# tables.toml — the table catalog: where each game table lives in each build,
# and what its fields mean.
#
# Schema only. No value from any table goes in this file, or anywhere else in
# the repository (CLAUDE.md rule 1): `tools/tables.py dump` reads the values
# out of the player's own BOF3.exe or disc, to the terminal or to analysis/.
# Why a catalog of tables and not of items: docs/ASSET_SOURCES.md section 5,
# docs/exe-table-audit.md section 5.
#
#   [[table]]         one table
#     key             short name for the command line
#     symbol          its symbols.toml [[data]] name, which holds the PC address
#     group           items | shops | progression | battle | field | library |
#                     platform | audio
#     what, index     what a record is, and what indexes the table
#     count, stride   records, and bytes per record, in the PC build
#     name            { at } - a 16-byte name field at that offset in the PC
#                     record. On a disc it is narrower ([meta] name_len), and
#                     every field after it moves up by the difference.
#     find_in         the disc file a build with no recorded address is
#                     searched in, by the PC table's numeric bytes
#     [[table.psx]]   a recorded disc address: build (fixtures.toml id),
#                     file, section, addr, status, cite. `file` is an EMI by
#                     its path under the data root (ETC/GAME.EMI) with its
#                     `section` index, "BOOT" for a PSX boot EXE (addr the load
#                     address), "BOOT.BIN" for a PSP ELF (addr its link-time
#                     offset, tools/psp_elf.py - not a file offset: the ELF's
#                     first program header starts 0x80 into the file), or a
#                     list when which one holds the table is not settled. A
#                     PSP disc has two rows where the table is in both its ELF
#                     and its EMI copy; the PSP's own code reads the ELF's
#     pc_twin         instead of `symbol`, for a disc table with no PC
#                     counterpart: why there is none
#     count_status, count_cite   how sure the count is, where no reader
#                     bounds the index
#     [[table.field]] at (PC offset), type, name, meaning, status, cite;
#                     `bits = [lo, hi]` for a bit field of that word;
#                     `repeat = [n, step]` for n copies, step bytes apart;
#                     `overlaps = true` when two views of the same bytes are
#                     both worth naming
#
# status is the evidence tier (docs/README.md): evidence = read in the code
# and cited, hypothesis = inferred, unknown = nobody has read it.
#
# tools/tables.py check validates this file against symbols.toml and
# fixtures.toml, and exe_maps/<build>.tsv (where every byte of BOF3.exe's
# initialised data the twin survey placed is in each build: tools/exe_twins.py);
# CI runs it. `tables.py locate` writes the [[table.psx]] rows.

[meta]
updated = 2026-10-08
# The name field's width by build. The PC's 16 is the JP disc's 8 widened;
# the Western discs have 12 (loc_build.py NAME_TABLES, measured 2026-09-20).
name_len = { "pc-zh" = 16, japanese = 8, western = 12 }

# ---------------------------------------------------------------------------
# Items and abilities
#
# The five item tables chain in .data: consumables + 92 * 22 = key items;
# + 16 * 20 = weapons; + 83 * 28 + 4 = armour; + 68 * 26 = accessories
# (symbols.toml, NameTable_Consumables). Every numeric byte equals the JP
# disc's, 534 of 534 records (loc_build.py, 2026-09-20).
# ---------------------------------------------------------------------------

