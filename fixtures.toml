# fixtures.toml — the builds this project compares against.
#
# No game data lives in this repository (CLAUDE.md rule 1). This file records
# *which* artifacts a result was produced against, by hash, so two people can
# confirm they are comparing like for like without anyone hosting anything.
# The pattern is the archival sibling's: see its `catalog_identity.json`
# (`rom_identity`) and `disc-receipt.json`.
#
# Why it is a table and not two hashes: there are five PlayStation releases,
# one language each, and they are NOT interchangeable — the executables are not
# address-compatible across regions and 37 image sections differ by language
# (BreathOfFire3Recomp/docs/regional-builds.md). A receipt that does not name
# the build is not evidence of anything.
#
#   status = "verified"   hashes measured locally on this machine
#            "known"      identity established from an external source; we do
#                         not have the artifact and have measured nothing
#
#   tools/verify_fixtures.py checks a local install against this table.
#
# Adding a row for an artifact you have: measure it, cite how, set verified.
# An unrecognised hash is not necessarily wrong — it may be a build nobody has
# catalogued. Open an issue rather than editing a row to match what you have.

[meta]
updated = 2026-10-08
note = "JP disc + Chinese PC port are the working pair. Held and verified: the JP, US, FR and DE PSX discs and both PSP discs (2026-10-06, docs/region-diff.md), and psx-eu-en (2026-10-08) - every catalogued release."
# Per-file manifests (2026-10-06): an artifact with `manifest` names a file in
# fixtures/ holding one `path<TAB>size<TAB>sha256` line per file of the tree,
# LF line ends; `manifest_sha256` is that file's own hash. A ripped disc hashes
# the same file by file whether it is a .bin/.cue or an .iso (ASSET_SOURCES.md
# section 1). Written by `tools/region_diff.py files`, checked by
# `tools/verify_fixtures.py --tree`. A PSX disc's .STR files are hashed as
# tools/psx_disc.py reads them, 2,048 bytes a sector.

# ---------------------------------------------------------------------------
# The PC port — this project's subject
# ---------------------------------------------------------------------------

[[build]]
id = "pc-zh"
role = "pc-port"
language = "Chinese"
description = "Chinese PC port, 2001-04-18"
status = "verified"
[build.artifacts.exe]
name = "BOF3.exe"
size = 2584576
sha256 = "15984158e0badb4b2f9471c1e9003bb18b2ab11aff47af2376f9ebcd31dfb8cb"
md5 = "0ebf48d81d43463aeadbc730660f1a73"
measured = "2026-09-18, tools/pe_funcs.py and hashlib on this machine"

# The DAT/ tree as shipped: the 742 original containers (DAT_CONTAINER.md
# section 4's open item). Our language overlays (<lang>.<NAME>.DAT) sit beside
# them in an install and are excluded by `match`. Every file's mtime is
# 2001-04-18 or earlier and the chunk census (2,087 data, 593 image, 901 bank,
# 1 kind 3) is DAT_CONTAINER.md's, so this is taken as the shipped state.
[build.artifacts.dat_tree]
name = "DAT/"
match = "[A-Z0-9_]+\\.DAT"
files = 742
bytes = 333782442
manifest = "fixtures/pc-zh.DAT.files.tsv"
manifest_sha256 = "b400a246051a4e16e4615bceb03cfbeb535338daf8da4554d0e5d103fe4f19c6"
measured = "2026-10-06, tools/region_diff.py files on this machine"

# The two FMV files, as shipped. Recorded because DIV-0001 replaces one of them:
# a substitution is only provable against a known original.
[build.artifacts.capcom_avi]
name = "capcom.avi"
size = 2262824
sha256 = "65ca9b150945e9973cd86492388f574d884603ce894300d6813f828e32df118a"
md5 = "8278fe7cf33dd763c1928c2a739a9da6"
codec = "IV50 (Indeo Video 5), 640x480 15fps + PCM 22050 stereo"
measured = "2026-09-19, sha256sum/md5sum on this machine"
note = "Undecodable on Vista+; replaced by DIV-0001. Kept as capcom.avi.indeo5."

[build.artifacts.logos_avi]
name = "logos.avi"
size = 3899442
sha256 = "a06536fe0ce92803587c8b8e0694360b89f1fd77dc5cbef3647ac5393b034564"
md5 = "a0a5a582ee5de3ffd4f9c6bdafbad6f0"
codec = "CRAM (Microsoft Video 1), 640x480 14.98fps, no audio"
measured = "2026-09-19, sha256sum/md5sum on this machine"

# Not an original: the DIV-0001 replacement, recorded so an install can be
# identified as patched rather than corrupt.
[build.artifacts.capcom_avi_cinepak]
name = "capcom.avi (DIV-0001, Cinepak)"
size = 4609908
sha256 = "460d25ce731c40d653286087b43655aca88aa661f2e3423b1c78590dc318f4f6"
codec = "cvid (Cinepak), 640x480 15fps + PCM 22050 stereo (stream-copied)"
measured = "2026-09-19, ffmpeg 9.0.1 on this machine; see docs/DIVERGENCE.md DIV-0001"
note = "Encoder-version dependent — a different ffmpeg gives a different, equally valid file."

