note = "Also the base of the DAT arena: LoadDatFile 0x454590 copies every kind-0 payload to 0x803580 + tag (disasm 2026-09-19), so this block is the port's image of PSX RAM from 0x80010000, of which the message pools are the first part. The arena's size is unread; the highest tag + size over every kind-0 chunk in the 742 shipped DAT files is 0xE0C4C (MAGIC134.DAT, measured 2026-09-19). One address, one symbol: src/game/dat_load.cpp addresses the arena through this constant."

[[block]]
