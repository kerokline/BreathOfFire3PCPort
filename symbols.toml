# ---------------------------------------------------------------------------
# FMV playback
#
# Porting-house code: the PlayStation release has no AVI (its FMV is STR
# through the MDEC), so nothing here transfers from the PSX side and no `psx`
# field is possible. Established 2026-09-19, docs/replacing-mci.md.
# ---------------------------------------------------------------------------

[[func]]
pc = 0x59E360
name = "Fmv_Play"
args = ["filename", "hwnd", "fullscreen"]
status = "evidence"
evidence = "disasm 2026-09-19: sprintf + mciSendStringA 'open avivideo!%s alias vfw', retrying with the CD-root prefix from 0x5A7370 on failure; Fmv_EnterFullscreen 0x59E4F0; SetWindowLongA(hwnd, GWL_WNDPROC, Fmv_WndProc 0x59E570); 'window vfw handle %d'; 'put vfw destination at 0 0 640 480'; 'play vfw window from 0 notify'; sets 0x6BE1C8 = 1; blocking GetMessageA/TranslateMessage/DispatchMessage loop until 0x6BE1C8 clears; 'stop vfw wait'; 'close vfw wait'; restores the WndProc, Releases the FMV DirectDraw object at 0x6BE1CC, SetWindowPos, restores GWL_STYLE from 0x6BE1C4. Sole holder of all seven MCI command strings (pe_xref.py: one reference each, all inside this function)."
note = "The only MCI caller in the binary. Two call sites, both in 0x4FCB00 (CAPCOM.AVI at 0x4FCD0F, LOGOS.AVI at 0x4FCD26). Modal and blocking — the game's main loop does not run during playback."

[[func]]
pc = 0x59E4F0
name = "Fmv_EnterFullscreen"
args = ["hwnd"]
status = "evidence"
evidence = "disasm 2026-09-19: SetWindowLongA(hwnd, GWL_STYLE, WS_POPUP) saving the old style to 0x6BE1C4; DirectDrawCreate(NULL, &0x6BE1CC, NULL) via 0x5ACBB0; vtable +0x50 SetCooperativeLevel(hwnd, 0x11 = DDSCL_EXCLUSIVE|DDSCL_FULLSCREEN); vtable +0x54 SetDisplayMode(0x280, 0x1E0, 0x10); SetWindowPos(0, 0, 640, 480, SWP_SHOWWINDOW). Returns 1 on success, 0 on any failure."
note = "Creates a SECOND DirectDraw object, separate from the game's — FMV does not composite with the renderer. The exclusive-fullscreen 640x480x16 mode-set here is the most fragile operation in the program on a compositing desktop, and it runs twice before the title screen (docs/replacing-mci.md section 6)."

[[func]]
pc = 0x59E570
name = "Fmv_WndProc"
status = "evidence"
evidence = "disasm 2026-09-19: WM_KEYDOWN (0x100) and WM_LBUTTONDOWN (0x201) clear the playing flag 0x6BE1C8 — the skip path; WM_ACTIVATEAPP (0x1C) with wParam != 0 calls SetFocus(hwnd) then mciSendStringA('resume vfw'); WM_DESTROY (0x2) handled; everything else falls through to the saved procedure. Installed and removed by Fmv_Play 0x59E360."

[[data]]
pc = 0x6BE1C8
name = "Fmv_Playing"
status = "evidence"
evidence = "Byte. Cleared at Fmv_Play 0x59E360 entry, set to 1 immediately after 'play vfw window from 0 notify', and the sole loop condition of the modal message pump. Cleared by Fmv_WndProc 0x59E570 on key or click (2026-09-19)."
note = "Adjacent to Fmv_SavedStyle 0x6BE1C4 and Fmv_DDraw 0x6BE1CC; the three look like one small state block."

# ---------------------------------------------------------------------------
# File layer
#
# One small translation unit, 0x5A7370..0x5A75F0: a 16-slot table of CRT FILE*
# addressed by slot index, which is the "handle" every asset loader passes
# around. Porting-house code — the PSX side reads sectors through the CD
# subsystem, so nothing here has a `psx` counterpart. Established 2026-09-19,
# docs/asset-loading-path.md.
# ---------------------------------------------------------------------------

[[data]]
pc = 0x7DE3E4
name = "File_Slots"
ctype = "void *"
count = 16
status = "evidence"
evidence = "disasm 2026-09-19: File_Open 0x5A7380 scans dwords from 0x7DE3E4 up to the bound 0x7DE424 (= 16 slots) for a zero entry, returns -1 when it counts 0x10 taken, and stores the fopen result at slot*4 + 0x7DE3E4. File_Read/File_Write/File_Seek/File_Size/File_Close all index the same base by their first argument; File_Close zeroes the slot after fclose."
note = "Elements are FILE* belonging to the MSVC6 CRT statically linked into BOF3.exe. They are opaque to us: a FILE* from our own CRT must never be stored here, nor one of these passed to ours."

[[func]]
pc = 0x5A7370
name = "File_CdRoot"
ret = "char *"
params = "void"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: mov eax, 0x66BC2C; ret. Returns the drive-root prefix buffer (initialised to the three characters C, colon, backslash) that File_Open 0x5A7380 and Fmv_Play 0x59E360 prepend when a bare open fails."

[[func]]
pc = 0x5A7380
name = "File_Open"
ret = "int"
params = "const char *path, int unused1, int unused2"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: finds the first free File_Slots entry (-1 if all 16 taken); Crt_fopen(path, 'rb'); on failure sprintf(buf[0x50], '%s%s', 0x66BC2C, path) and retries; stores the FILE* in the slot and returns the slot index, or -1. Reads only its first stack argument — LoadDatFile 0x454590 pushes two further zeros that are never touched. 5 callers (pc_funcs.json): 0x454590, 0x454770, 0x454820, 0x587910, 0x587A20."

[[func]]
pc = 0x5A7470
name = "File_Read"
ret = "unsigned"
params = "int handle, void *dst, unsigned size"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19, 11 instructions: return Crt_fread(dst, 1, size, File_Slots[handle]). No bounds check on handle, no null check on the slot. 5 callers (pc_funcs.json): 0x454590, 0x454770, 0x454820, 0x587910, 0x587A20 — every asset loader."
note = "Phase 0 exit-test target: first function of Capcom's binary replaced by ours."

[[func]]
pc = 0x5A74A0
name = "File_Write"
ret = "unsigned"
params = "int handle, const void *src, unsigned size"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: instruction-for-instruction the shape of File_Read 0x5A7470 with the CRT callee 0x5B9E65 in place of fread; sole caller Save_WriteFile 0x454870. 0x5B9E65 is the same lock 0x5BCBD3 / inner / unlock 0x5BCC25 wrapper as Crt_fread with a different inner routine, and the observed effect is a write: two saves produced files of exactly the requested 0x12B0 bytes (2026-09-19)."

[[func]]
pc = 0x5A74D0
name = "File_Size"
ret = "int"
params = "int handle"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: Crt_filelength(Crt_fileno(File_Slots[handle])). 0x5C3660 returns FILE+0x10 (MSVC6 _file); 0x5C35D6 validates the fd against the ioinfo table then lseek(fd,0,CUR) / lseek(fd,0,END) / restore — _filelength."

[[func]]
pc = 0x5A74F0
name = "File_Seek"
ret = "int"
params = "int handle, int offset"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19, 9 instructions: return Crt_fseek(File_Slots[handle], offset, 0). The callee 0x5B9F9E was read the same day and is MSVC6 fseek (see Crt_fseek), so the constant 0 is SEEK_SET. No bounds check on handle, no null check on the slot."

[[func]]
pc = 0x5A7510
name = "File_Close"
ret = "void"
params = "int handle"
impl = "src/game/file_io.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: calls 0x5B9993 on File_Slots[handle], then stores 0 to the slot. 6 callers — the five openers' callers plus 0x454870."

[[func]]
pc = 0x5B9D4E
name = "Crt_fread"
ret = "unsigned"
params = "void *dst, unsigned size, unsigned count, void *stream"
status = "evidence"
evidence = "disasm 2026-09-19: lock(stream) 0x5BCBD3 / inner 0x5B9D7D / unlock 0x5BCC25 — the MSVC6 multithread-CRT wrapper shape; the inner routine computes size*count, returns 0 when that is zero, and tests FILE+0x0C (_flag) against 0x10C (_IOMYBUF|_IONBF|_IOYOURBUF) to choose the buffer size from FILE+0x18 (_bufsiz) or 0x1000. That is MSVC6 fread.c."

[[func]]
pc = 0x454590
name = "LoadDatFile"
ret = "void"
params = "int file_index"
