note = "Top wraps from 0x3FF to 0 - which reads as 'none left' from then on, until a release. So the last index in the array can be handed out, and after it the pool is empty; consistent."

[[func]]
pc = 0x56FC70
name = "DrawItemPool_Release"
ret = "unsigned"
params = "unsigned short index"
impl = "src/game/draw_pool.cpp"
status = "evidence"
evidence = "disasm 2026-09-20, 9 instructions, cdecl, no calls, no jumps: Top = (Top - 1) & 0x3FF, DrawItemPool_Free[Top] = the argument's low word. Leaves the new Top in eax, upper bits clear. Four callers (E8 scan), all in 0x56FA00..0x56FC6D; the three read (0x56FAB6, 0x56FC13, 0x56FC39) do not use eax. Call trace all_a: 2,937 calls."
note = "No check for a full pool: releasing with Top == 1 stores at index 0, and with Top == 0 at index 0x3FF. Returning Top is kept because it costs nothing, not because a use of it was seen."

