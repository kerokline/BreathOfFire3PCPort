# --- 2026-09-22 (third round), group H: the message box and the two pens
#
# src/game/msgbox.cpp, docs/msgbox.md. Thirty-five new entries; the eight that
# already existed (Msg_OpenScript, MsgBox_Reset, MsgBox_FrameTask,
# MsgBox_Step, MsgBox_StateDispatch, Window_Alloc, Text_DrawAt,
# Text_EmitGlyph) only gained a signature and impl where they stand.
#
# Every size below is the body's real extent, measured to the ret with
# capstone on 2026-09-22 - not pe_funcs.py's, which was wrong for five of
# these (docs/msgbox.md section 6). Six of the functions dispatch through a
# table built on the stack out of mov dword [esp+k], imm32; the entries are
# listed in each evidence string, because nothing else in the tree records
# them.
#
# 0x4981C0 (state 4 entry 5) and 0x4983C0 (state 5 entry 3) are deliberately
# NOT here: both call through Area_Descriptors +0x34 by area number and into
# the unread 0x498A30, so neither can be cloned or read clean. They stay
# Capcom's and ours calls them by address.
# ---------------------------------------------------------------------------

[[func]]
pc = 0x497B30
psx = 0x8015096C
name = "MsgBox_StatePrint"
ret = "void"
params = "void"
impl = "src/game/msgbox.cpp"
status = "evidence"
evidence = "disasm 2026-09-22, 0x497B30..0x497E30 (769 bytes) with its OWN 23-entry jump table at 0x497E34 (92 bytes, dispatched by jmp [ecx*4 + 0x497E34] at 0x497B95) - pe_funcs.py calls the whole run one 256-byte function. State 0, the code consumer ahead of the printer: it loops while a keep-going flag is set, and every code but 0x05 0x08 0x0A 0x0C 0x0F 0x10 0x11 and the no-ops clears it, so one frame normally eats one code. A glyph sets the per-character delay from the two-column table at 0x658E94 (column by bit 5 of Input_Held, row by the signed speed byte 0x903A58), counts 0x7DEE59 up and leaves for state 0 or 1; under the instant-print flag 0x10 it only counts up and the tail sets the flag again, so the whole span between the 0x10 and the 0x11 that toggles it back is eaten in one frame. Codes 0x00 0x02 0x0B 0x14 0x16 set the next state (2, 3, 1, 4-or-5, 7). The PSX twin 0x8015096C branches on the same codes with a compare chain instead of a table; its 0x801490A0 block is this one at the MsgBoxState delta."
