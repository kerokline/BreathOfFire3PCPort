# Group 2 of the world-map wave (docs/area-backdrop.md, src/game/area_backdrop.cpp):
# the three handlers of AreaMap_EntryHandlers that map_layers left, renamed
# from AreaMap_EntryKind1..3 (their entries moved here from the group D
# callees block), and the world map's sprite pin. Read whole with capstone
# 2026-09-23 against the PSX twins (the sibling's tools/disasm_exe.py).

[[func]]
pc = 0x571BE0
name = "AreaMap_DrawBackdrop"
psx = 0x80159108
ret = "void"
params = "const unsigned char *entry"
impl = "src/game/area_backdrop.cpp"
status = "evidence"
evidence = "disasm 2026-09-23, 0x571BE0..0x571D26 (0x147 bytes), cdecl, five calls, every jump internal. AreaMap_EntryHandlers entry 1 (0x6632A0). Nothing while MapView_BuildFlags is 0; then the entry's dword +4 as four bytes x0 z0 x1 z1 against the focus in cells, (0x7FFF - MapView_FocusX) >> 8 and (0x8000 - MapView_FocusZ) >> 8, signed 32-bit compares, all four must hold. Gpu_SetDrawMode(Gfx_PacketNext, 0, 1, 0x95, 0), Gfx_CommitPrim(7, 0xC); the cursor read again; Gpu_SetPolyG4, Gpu_SetSemiTrans(p, 0); corners (0, 0) (320, 0) (0, 240) (320, 240) as floats at +8 +0x18 +0x28 +0x38 - the left x a zeroed register, not an immediate; the colour dword at +8, or +12 when Cond_ByteFF is set: its low word's 5-bit r g b unpacked to 8 (and 0x1F, shl 3) into corners 0 and 1, its high word's into 2 and 3; Gfx_CommitPrim(7, 0x44). PSX FUN_80159108 instruction for instruction (shorts, 0x24 bytes), except that the PSX picks tpage 0x225 over 0x95 by two video-mode tests (0x8017BC2C) the port dropped. Never traced (absent from entries_plus_hidden.txt); on screen in the world-map route's hill and coast areas (docs/world-map.md section 4). The area's sky gradient: widened under BOF3X_WIDE, DIV-0041."

[[func]]
pc = 0x571D30
name = "AreaMap_TextureCycle"
psx = 0x801592EC
ret = "void"
params = "const unsigned char *entry"
impl = "src/game/area_backdrop.cpp"
status = "evidence"
evidence = "disasm 2026-09-23, 0x571D30..0x571E14 (0xE5 bytes), cdecl, three calls, every jump internal. AreaMap_EntryHandlers entry 2 (0x6632A4). Area_TestCondition(word +4, pushed with stale high bits) or nothing; f = Frame_Counter mod (byte 0 + 1); from +8, pairs of dwords (A, B) scanned while f is above A's top byte (no end but a threshold at or above f); then a VRAM move: rect x = (A >> 16 & 0xF) << 7 + (B >> 9 & 0x7F) + 0x140, y = (B & 0xFF) + 0x100, w = B's top byte, h = B byte 2 + 1, to x = (A >> 20 & 0xF) << 7 + (A >> 9 & 0x7F) + 0x140, y = (A & 0xFF) + 0x100: Gpu_SetDrawMove(Gfx_PacketNext, rect, x, y), Gfx_CommitPrim(6, 0x18). PSX FUN_801592EC instruction for instruction (its divu has a break on zero the PC cannot reach: the divisor is a byte + 1). Never traced; fuzz only."

[[func]]
pc = 0x571E20
name = "AreaMap_SlotZones"
psx = 0x801593FC
ret = "void"
params = "const unsigned char *entry"
impl = "src/game/area_backdrop.cpp"
status = "evidence"
evidence = "disasm 2026-09-23, 0x571E20..0x571FE6 (0x1C7 bytes), cdecl, no calls, every jump internal. AreaMap_EntryHandlers entry 3 (0x6632A8). Nothing while Draw_OtSlot is 4; count = byte +2 less 1, nothing at or below 0; per zone dword from +4 - x0 the top byte, z0 byte 2, width bits 9..15, depth bits 2..8, bit 0 the sense - each of ObjTrio's three objects (0x802D40, stride 0x14C: positions +0x34 / +0x38, flag byte +0x138, slot byte +0x29) whose rounded cell, the signed high word of position + 0x8000, lies in [x0, x0 + width) x [z0, z0 + depth) gets flag bit 0 set and slot 4 (sense 1) or flag bit 0 cleared and slot Draw_OtSlot (sense 0); the fourth object at 0x905DA0 (positions +0x34 / +0x38, byte +0xB) only its bit. PSX FUN_801593FC instruction for instruction, stride 0x140 (0x80145EC0 / 0x80145FB8 / 0x80145EB5, the fourth 0x8014629C / 0x80146273). Never traced; fuzz only. Named for what it sets: the slot byte is what Sprite_Draw commits to."

[[func]]
pc = 0x4112A0
name = "WorldMap_PinSprite"
ret = "void"
params = "void"
impl = "src/game/area_backdrop.cpp"
status = "hypothesis"
evidence = "disasm 2026-09-23, 0x4112A0..0x4112B7 (0x18 bytes, then nops to 0x4112C0), cdecl, no calls, no jumps: Sprite_Current +0x2E = 0xA0, +0x30 = 0x50 - the sprite's screen point (what Sprite_UpdateScreen writes and Sprite_DrawOverlays reads) pinned to (160, 80). Rel32 scan of .text: 33 callers, eleven triads at 0x401F80 / 0x401FD0 / 0x402030, 0x404030 / 0x404080 / 0x4040E0, .. 0x424D50 / 0x424DA0 / 0x424E00 - one per world-map region overlay compiled into the exe - each calling it first, then moving the sprite's scale +0x40 by 0x2000, counting +9 down, setting +0x48 and the state +1, and tail-jumping to Sprite_UpdateScreen 0x5890E0. World-map route (recipe_worldmap): 259 calls, from 0x404035 (24) and 0x404085 (211); not reached by the attract cycle or the shop route. Hypothesis in the name: that the pinned sprite is the party's marker over the map. It is not the sky (widescreen.md section 3d called 0x4112A9 that): a centred point needs nothing under the primitive shift."
