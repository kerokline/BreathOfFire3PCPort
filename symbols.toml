evidence = "disasm 2026-09-22, 0x587740..0x587858 (0x119 bytes, whole), cdecl. id & 0xFFFF; bank = bits 8-11, cue = the low byte; the cue is four dwords at Sound_Banks + (bank - 1) * 0x384 + cue * 16 - the PSX SE_Play cue of up to four chord voices, bank:id alike. For each non-zero word: channel = bits 8-12, less 23 when 23 or more, into Sound_Channels; voice = the low byte. Voice 0xFF stops and forgets the channel's buffer (SndBuf_Stop). Otherwise the channel's buffer is stopped, and SndBuf_Play(the voice entry's sample pointer OR bit 15 moved to bit 31, the entry's buffer, the word's high half as the frequency); the channel keeps the entry's buffer (read again after the call) when bit 15 is set, else 0. Returns eax 0 always (its loop counter). 1,234 call sites (rel32 scan); hidden_b 148 calls."
note = "Bank 0 indexes 0x384 bytes before the table and a cue past 23 reads into the voice entries: nothing checks either (docs/sound.md section 2). The PSX SE_Play takes banks 0..6."

