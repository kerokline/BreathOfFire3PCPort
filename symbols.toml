status = "evidence"
evidence = "disasm 2026-09-20 and 2026-09-21, cdecl, one byte argument, no calls, every jump internal, 0x4A bytes. al = handle & 0x3F; without bit 7 returns al + 0x1E. With bit 7: dl walks 0..0x1D, stored each time into the argument's own stack slot, and bl counts objects whose byte at 0x7DEE86 + dl * 0xA4 (Sprite_Objects +6) is 0x0A, stopping when bl equals al at such an object; then returns - al unchanged. The handle comes from the movement-script command F8 07 (0x5792A0), which stores its byte at object +0x18. Callers 0x5192AC, 0x58977F read al only. Call trace all_b: 42,936 calls."
note = "PSX twin 0x8015BEE4 in the boot EXE (psx_pair call-anchored; read 2026-09-21 in the sibling's recompiled output): the same arithmetic, and on a match it returns the count of matches, which equals the number sought - so the discarded search is Capcom's, not the port's. No shipped script attaches with a bit-7 handle: docs/known-defects.md D6."

