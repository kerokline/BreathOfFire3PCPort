[[block]]
name = "EnemyWorkingRecords"
pc = 0x93B9E0
psx = 0x801EB620
field_shift = 0x10
pc_stride = 0x128
psx_stride = 0x118
status = "evidence"
evidence = "Stride read off PC 0x44A960 (sub 3 / x9 / x37 / x8 = 296 = 0x128) against the PSX 0x118 in BATTLE_RAM.md. At field_shift 0x10, 21 of 26 documented PSX fields land on an address referenced as an absolute operand in .text, baseline 17.2%, binomial P = 2.46e-12 (2026-09-18). Corroborated structurally: the nine consecutive resistance-grid bytes PSX +0x2F..+0x37 land on PC 0x93BA1F..0x93BA27 and all nine are referenced, split between 0x44EE80 (first six) and 0x44F030 (last four) exactly as the PSX split between Battle_ElementAffinity and 0x8009FD08."
note = "The PC record is 0x10 longer because a 16-byte name is prepended (0x44A960 copies 12 bytes of it out). So every field sits 0x10 later than its PSX counterpart. Misses in the field test — +0x04 zenny, +0x1C/+0x1E drop 2, +0x22 max AP, +0x94 charge multiplier — are fields no instruction happens to reach at a constant offset off record 0, not evidence against the shift."

[[block]]
name = "PartyWorkingRecords"
pc = 0x802D50
psx = 0x80145E8C
field_shift = 0x0
pc_stride = 0x14C
psx_stride = 0x140
status = "evidence"
evidence = "Stride read off PC Battle_ElementAffinity's party branch (x5 / x41 / x83 / x4 = 332 = 0x14C). 19 of 21 documented PSX fields land on a referenced PC address at shift 0, baseline 26.8%, binomial P = 1.60e-09 (2026-09-18). Corroborated: PC party HP 0x802DD8 and PC enemy HP 0x93BA04 share six referencing functions (0x437CC0, 0x43B130, 0x44B9F0, 0x44FCE0, 0x49D680, 0x596A90) — the damage path touches both sides."
note = "The record grew 0xC but every documented field keeps its offset, so the growth is past +0x13C, beyond what BATTLE_RAM.md covers. Carries a copy of the persistent character record at +0x74; that record did not change size (164 bytes in both)."

[[block]]
name = "DamageScratch"
pc = 0x903850
psx = 0x1F800000
status = "hypothesis"
evidence = "Battle_ScaleDamage 0x446430 reads the weapon/element byte from 0x903850 and tests it for 0x1F then 0x20, exactly where PSX Battle_ScaleDamage reads scratchpad 0x1F800000 (names/functions.toml)."
note = "NOT a delta — the PSX scratchpad is 1 KB of on-chip fast RAM with no x86 equivalent, so the port relocated it to an ordinary global. Expect the same for every other 0x1F80xxxx address: they will never transfer by arithmetic. Only the one word is confirmed; the extent of the relocated block is unknown."

