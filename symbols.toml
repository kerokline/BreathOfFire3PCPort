[[func]]
pc = 0x462070
name = "Gfx_UploadLzss"
ret = "void"
params = "const void *packed, const short *rect"
impl = "src/game/gfx_unpack.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: cdecl, same arguments as Gfx_UploadPacked5, 0x410 bytes of locals. total = w * h * 2. An LZSS decoder: a 512-byte window on the stack, zeroed, write position starting at 0x1EE; input from packed + 4; flag bytes read low bit first, 1 = literal byte, 0 = two bytes b0, b1 giving a window offset b0 | (b1 & 0xF0) << 4, masked to 0x1FF as it is used, and a length of (b1 & 0x0F) + 3. Output goes to the scratch at Gfx_UnpackNext until total bytes are out - a match may overrun total. Then Gfx_LoadImage(rect, scratch) (0x462189) and Gfx_UnpackNext advances by total rounded up to 4. Called only by Gfx_FlushUploadQueue for record kind 2."
note = "The window is only partly initialised: rep stosd of 0x7B dwords plus one stosw zeroes 0x1EE bytes (0x462093..0x4620BE), and the last 18 - one maximum match - keep whatever the stack held. A valid stream never reads them before writing them; random data does, and then the original disagrees with itself from call to call (differential fuzz 2026-09-19, 13 of 1,500 rounds, every one a kind-2 record). A reimplementation has to pick a value for those bytes, which the original does not define. 0x410 bytes of stack on a path reached from WinMain's loop and, under DIV-0004, from Gfx_BeginFrame - both on the main stack, not a 16 KB task stack."

