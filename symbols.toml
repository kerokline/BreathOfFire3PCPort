evidence = "Stride read off PC 0x44A960 (sub 3 / x9 / x37 / x8 = 296 = 0x128) against the PSX 0x118 in BATTLE_RAM.md. At field_shift 0x10, 21 of 26 documented PSX fields land on an address referenced as an absolute operand in .text, baseline 17.2%, binomial P = 2.46e-12 (2026-09-18). Corroborated structurally: the nine consecutive resistance-grid bytes PSX +0x2F..+0x37 land on PC 0x93BA1F..0x93BA27 and all nine are referenced, split between 0x44EE80 (first six) and 0x44F030 (last four) exactly as the PSX split between Battle_ElementAffinity and 0x8009FD08."
