# BreathOfFire3PCPort — symbol map for the Chinese PC port's BOF3.exe
#
#   BOF3.exe, 2,584,576 bytes, 2001-04-18,
#   sha256 15984158e0badb4b2f9471c1e9003bb18b2ab11aff47af2376f9ebcd31dfb8cb
#   image base 0x400000 (/FIXED, no .reloc — every address here is stable)
#
# Shape follows ../BreathOfFire3Recomp/symbols.toml so the same tooling reads
# both sides. Two fields are new and exist because this table is downstream of
# that one (docs/PLAN.md section 3):
#
#   psx     the PSX address this name was transferred from, or absent if the
#           name was derived on the PC side first.
#   status  unnamed | hypothesis | evidence | verified — the tier the claim is
#           entitled to (docs/README.md). A name transferred by address-delta
#           propagation alone is a hypothesis until a body or a field read
#           confirms it. It never inherits "confirmed" from the PSX side.
#
# Addresses are load-bearing constants (CLAUDE.md rule 3).
#
# Fields that drive code generation (tools/gen_symbols.py -> bof3/symbols.gen.h):
#
#   ret / params   the C signature. A [[func]] without `ret` gets an address
#                  constant only — it cannot be called from our code until
#                  someone has read it well enough to type it.
#   cc             calling convention, default "__cdecl".
#   impl           path of OUR source file that replaces this function. Present
#                  = the name binds to our prototype and the detour is
#                  installed; absent = the name binds to the original address.
#                  Call sites are identical either way (docs/SCAFFOLDING.md).
#   ctype / count  on [[data]]: element type, and element count for arrays.

[meta]
image_base = 0x400000
text_va = 0x401000
text_size = 1844840
# PE header identity, checked by the injected DLL before it patches anything:
# every address below is only meaningful inside this exact image.
pe_timestamp = 0x3ADD0C06
size_of_image = 0x53F000
sha256 = "15984158e0badb4b2f9471c1e9003bb18b2ab11aff47af2376f9ebcd31dfb8cb"

