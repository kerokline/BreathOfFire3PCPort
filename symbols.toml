name = "Crt_filelength"
ret = "int"
params = "int fd"
status = "evidence"
evidence = "disasm 2026-09-19: validates fd against the handle count at 0x93C6A0 and the open bit of its ioinfo entry (table at 0x93C5A0), then lseek(fd,0,CUR) / lseek(fd,0,END) / restore - MSVC6 _filelength."

