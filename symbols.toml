# ---------------------------------------------------------------------------
# Task system - cooperative coroutines
#
# Hand-written assembly, not compiler output (pushes and pops of a fixed
# register set around a raw esp swap). The PC counterpart of the PSX task
# system. Established 2026-09-19, docs/attract-mode.md section 2.
# ---------------------------------------------------------------------------

[[block]]
name = "Task_Records"
pc = 0x66C7D0
status = "evidence"
evidence = "disasm 2026-09-19 of 0x5A98A0 / 0x5A9914 / 0x5A9949: four records of 0x20 bytes (the scheduler walks edx = 0, 0x20 .. < 0x80). +0 u16 state (0 free, 1 sleeping, 2 runnable), +2 u16 frames left to sleep, +4 saved esp, +8..+0x1F task-private words (0x5A99F4 zeroes +8..+0x17 of the current task). The current task's record offset is at 0x66C850, the scheduler's own esp at 0x66C854, the top of the stack arena at 0x66C858."
note = "Task 0's private words at +0x18/+0x1A are 0x66C7E8 / 0x66C7EA - the top-level mode and sub-step words that 0x588E88 dispatches on through the table at 0x667294."

[[func]]
pc = 0x5A98A0
name = "Task_RunAll"
ret = "void"
params = "void"
status = "evidence"
evidence = "disasm 2026-09-19: saves ebx/ecx/esi/edi/ebp and esp to 0x66C854; for each of four records: skip if state 0; if state 1, decrement the sleep count and skip unless it reached 0, then mark 2; load esp from the record, pop ebp/edi/esi/edx/ecx/ebx, ret - resuming the task where it yielded. Tasks return here by jumping to 0x5A98F0, which restores the scheduler esp and continues the walk. Called once per logic frame from WinMain's loop (0x4FCF82) unless the F9 pause byte 0x6BC63A is set."

[[func]]
pc = 0x5A9914
name = "Task_Create"
ret = "void"
params = "int slot, void *entry"
status = "evidence"
evidence = "disasm 2026-09-19: record = Task_Records + slot*0x20; state = 2; saved esp = [0x66C858] - slot*0x4000 - 0x1C; writes entry at saved esp + 0x18, i.e. as the return address the scheduler's six pops and ret will reach. So each task owns a 0x4000-byte stack carved downward from 0x66C858. WinMain creates task 0 with entry 0x496B60."

[[func]]
pc = 0x5A9949
name = "Task_Sleep"
ret = "void"
params = "int frames"
status = "evidence"
evidence = "disasm 2026-09-19: current record state = 1, sleep count = frames (16 bits); pushes ebx/ecx/<return address juggled through eax>/esi/edi/ebp in the order Task_RunAll pops them, stores esp in the record, jumps to 0x5A98F0. The ubiquitous Task_Sleep(1) in wait loops (e.g. 0x588EC6) is 'yield until next frame'."
note = "Siblings, same shape, unnamed: 0x5A9976 restarts the current task at a new entry point (state 2, fresh stack, entry = argument); 0x5A99AD kills the current task (zeroes the record)."

[[func]]
pc = 0x5B9B6D
name = "Crt_fopen"
ret = "void *"
params = "const char *path, const char *mode"
status = "evidence"
evidence = "disasm 2026-09-19, 6 instructions: pushes 0x40 (_SH_DENYNO) and its own two arguments and calls 0x5B9B3C - MSVC6 fopen as a wrapper over _fsopen. Used by File_Open 0x5A7380 (mode rb), File_OpenWrite 0x5A7420 (wb) and Cfg_Load 0x4FD030 (rt), each storing the result where fread / fwrite / fgets later take a stream."

[[func]]
pc = 0x5B9E65
name = "Crt_fwrite"
ret = "unsigned"
params = "const void *src, unsigned size, unsigned count, void *stream"
status = "evidence"
evidence = "disasm 2026-09-19: lock(stream) 0x5BCBD3 / inner 0x5B9E94 / unlock 0x5BCC25, the same wrapper as Crt_fread. The inner routine tests FILE+0x0C (_flag) against 0x10C like fread's, copies into the stream buffer with the block-copy routine 0x5BDFF0, flushes through 0x5BCDB0 (the same flush Crt_fseek and Crt_fclose call) and writes directly through 0x5BE325. That is MSVC6 fwrite.c. Observed effect agrees: two saves of exactly the requested 0x12B0 bytes (2026-09-19)."

[[func]]
pc = 0x5B9F9E
name = "Crt_fseek"
ret = "int"
params = "void *stream, int offset, int whence"
status = "evidence"
evidence = "disasm 2026-09-19: lock 0x5BCBD3 / inner 0x5B9FCA / unlock 0x5BCC25. The inner routine rejects a stream whose _flag has none of 0x83 (_IOREAD|_IOWRT|_IORW) and a whence outside 0..2 by storing 0x16 (EINVAL) through the errno accessor 0x5BCA43 and returning -1; clears 0x10 (_IOEOF); for whence 1 adds the result of 0x5BE5ED (ftell) to the offset and switches to whence 0; flushes (0x5BCDB0); for an _IORW stream clears the low two flag bits, else for a read stream with _IOMYBUF and without _IOSETVBUF sets _bufsiz to 0x200; then calls 0x5BE515 as (FILE+0x10, offset, whence) and returns 0, or -1 if that returned -1. Step for step MSVC6 fseek.c."

[[func]]
pc = 0x5B9993
name = "Crt_fclose"
ret = "int"
params = "void *stream"
status = "evidence"
evidence = "disasm 2026-09-19: result preset to -1; a stream with 0x40 (_IOSTRG) just has _flag zeroed; otherwise lock 0x5BCBD3 / inner 0x5B99C4 / unlock 0x5BCC25, where the inner routine, for a stream in use (_flag and 0x83), flushes (0x5BCDB0), frees the buffer (0x5BCD57), closes the descriptor at FILE+0x10 (0x5BCC77) and frees and clears FILE+0x1C (_tmpfname). MSVC6 fclose.c."

[[func]]
pc = 0x5C3660
name = "Crt_fileno"
ret = "int"
params = "void *stream"
status = "evidence"
evidence = "disasm 2026-09-19, 3 instructions: returns the dword at stream+0x10, MSVC6 FILE._file."

[[func]]
