[[func]]
pc = 0x516B30
psx = 0x8014F6BC
name = "Text_DrawAt"
ret = "const unsigned char *"
params = "int x, int y, int color, int count, const unsigned char *text"
impl = "src/game/msgbox.cpp"
status = "evidence"
evidence = "disasm 2026-09-20, 12 instructions: stores word x to 0x8034F4 (pen x) and 0x7E1BE4 (line start x), word y + 1 to 0x8034F2, then calls the string draw 0x516B70 as (color, count, text) and returns what it returns - the pointer one past the last byte consumed. 341 relative callers (E8/E9 scan of .text): the general text draw, not the dialogue box's own. 0x516B70, read the same day: draws up to `count` characters or to a NUL; a byte <= 0x20 goes through the byte table 0x516D24 into the 7-entry jump table 0x516D08 (0x01 newline: y += 12, x = line start; 0x05 nn set colour; 0x06 restore colour; 0x07 nn draw the 32-byte record 0x904CE0 + nn * 32 by recursion; 0x20 advance without drawing; the rest fall into the glyph path); a byte with bit 7 set is a two-byte code, glyph = ((b0 & 0x7F) << 8) + b1; any other byte is glyph = b - 0x26. A glyph above 0xA00 executes `in al, dx` (a privileged instruction - a trap). The glyph index is written to word +0x16 of the primitive at [0x7E0670] - the tpage field of a POLY_FT4 - and the CLUT id 0x7800 | colour to +0x0E by 0x516D50, which builds a 12 x 12 quad. Then pen x += 12, flat."
note = "MsgBox_Step 0x497840 calls it at 0x497A22 with count 1 and keeps its own pen: reloads word 0x7DEE5C after the call and adds 12 (0x497A44), skipping a second text byte when the first has bit 7 set (0x497A2A). DIV-0006 re-aims that one call site."

