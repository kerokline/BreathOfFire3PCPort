# BreathOfFire3PCPort — symbol map for the Chinese PC port's BOF3.exe
#
#   BOF3.exe, 2,584,576 bytes, 2001-04-18,
#   sha256 15984158e0badb4b2f9471c1e9003bb18b2ab11aff47af2376f9ebcd31dfb8cb
#   image base 0x400000 (/FIXED, no .reloc — every address here is stable)
#
# Shape follows ../BreathOfFire3Recomp/symbols.toml so the same tooling reads
# both sides. Two fields are new and exist because this table is downstream of
# that one (docs/PLAN.md section 3):
#
#   psx     the PSX address this name was transferred from, or absent if the
#           name was derived on the PC side first.
#   status  unnamed | hypothesis | evidence | verified — the tier the claim is
#           entitled to (docs/README.md). A name transferred by address-delta
#           propagation alone is a hypothesis until a body or a field read
#           confirms it. It never inherits "confirmed" from the PSX side.
#
# Addresses are load-bearing constants (CLAUDE.md rule 3).
#
# Fields that drive code generation (tools/gen_symbols.py -> bof3/symbols.gen.h):
#
#   ret / params   the C signature. A [[func]] without `ret` gets an address
#                  constant only — it cannot be called from our code until
#                  someone has read it well enough to type it.
#   cc             calling convention, default "__cdecl".
#   impl           path of OUR source file that replaces this function. Present
#                  = the name binds to our prototype and the detour is
#                  installed; absent = the name binds to the original address.
#                  Call sites are identical either way (docs/SCAFFOLDING.md).
#   ctype / count  on [[data]]: element type, and element count for arrays.

[meta]
image_base = 0x400000
text_va = 0x401000
text_size = 1844840
# PE header identity, checked by the injected DLL before it patches anything:
# every address below is only meaningful inside this exact image.
pe_timestamp = 0x3ADD0C06
size_of_image = 0x53F000
sha256 = "15984158e0badb4b2f9471c1e9003bb18b2ab11aff47af2376f9ebcd31dfb8cb"

# ---------------------------------------------------------------------------
# Global blocks
#
# Related globals occupy one contiguous block in both binaries with identical
# internal offsets, at a per-block constant delta: pc = psx + delta. The linker
# reordered the blocks; it did not reorder their contents. Measured 2026-09-18,
# docs/kinship-probe-text-engine.md section 5. This is the unit that transfers.
# ---------------------------------------------------------------------------

[[block]]
name = "MsgBoxState"
pc = 0x7DEE40
psx = 0x8014909C
delta = 0x80695DA4
status = "evidence"
evidence = "12 fields verified field-for-field against MsgBox_Reset 0x8015042C's confirmed note by disassembling PC MsgBox_Reset 0x497770 (2026-09-18): the four zeroed state bytes 9C..9F, the and-0x40 on the flag word A0, the delay counter A2, message index A4, A6, box string base A8, stepper pointer AC, the zeroed B4..B7 run, box origin BC/BE, C4, and the 0x0C argument CA. No exceptions."

[[block]]
name = "WindowRecords"
pc = 0x803160
psx = 0x8014832C
delta = 0x806BAE34
status = "evidence"
evidence = "PC Window_Alloc 0x59E2D0 indexes slot*0x24 off 0x803160 and sets byte 0 = 1, +1 = kind, +2/+3 = 0, returns 0xFF when taken — byte for byte the PSX Window_Alloc 0x80159874 note, including the 0x24 stride. Corroborated by MsgBox_FrameTask 0x4977F0 reading x/y at +4/+6 (0x803164/66) exactly as PSX 0x80148330/32 (2026-09-18)."
note = "Record stride 0x24, same as PSX. +0/+1/+2/+3 = in-use/kind/../.., +4/+6 = x/y in 12.4 fixed, +0x10/+0x12 = w/h."

[[block]]
name = "MessagePools"
pc = 0x803580
psx = 0x80010000
delta = 0x807F3580
status = "evidence"
evidence = "Script pool base 0x803580 read by Msg_OpenScript 0x4976D0 as ptr = base + u16[base + 2*id]; system pool base 0x807580 read by Msg_SystemPtr 0x497740. The two pools sit 0x4000 apart in both binaries (PSX 0x80010000 / 0x80014000), so one delta covers both (2026-09-18)."
note = "Also the base of the DAT arena: LoadDatFile 0x454590 copies every kind-0 payload to 0x803580 + tag (disasm 2026-09-19), so this block is the port's image of PSX RAM from 0x80010000, of which the message pools are the first part. The arena's size is unread; the highest tag + size over every kind-0 chunk in the 742 shipped DAT files is 0xE0C4C (MAGIC134.DAT, measured 2026-09-19). One address, one symbol: src/game/dat_load.cpp addresses the arena through this constant."

[[block]]
name = "CharacterRecords"
pc = 0x903A70
psx = 0x80144964
delta = 0x807BF10C
status = "evidence"
evidence = "disasm 2026-09-19: the save block builder 0x5806F0 shows the live game block at 0x9039E0 (area word stored to 0x903A04 = block+0x24, checksum zeroed at 0x903A50 = block+0x70, both the PSX block offsets), which puts the records at block+0x90 = 0x903A70; 89 code references index it as lea reg, [idx*4 + 0x903A70] with idx = n*0x29, i.e. stride 0xA4. Same delta as the block base (PSX 0x801448D4). SUPERSEDES the earlier hypothesis pc = 0x64B390, which is a table in initialised data: 0x437820 copies 0x29 dwords from 0x64B80C = 0x64B390 + 7*0xA4 into a live record, so that address is most likely the eight initial-record templates."
note = "INTERNAL OFFSETS DIFFER FROM PSX: the name field is 9 bytes, not 5, and every later record field is +4 (docs/save-interchange.md section 2). The block-delta rule covers the record base and stride only."

