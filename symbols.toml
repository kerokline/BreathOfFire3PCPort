name = "Gfx_LoadImage"
ret = "void"
params = "const short *rect, const void *pixels"
impl = "src/game/gfx_image.cpp"
status = "evidence"
evidence = "disasm 2026-09-19: rect is four s16 (x, y, w, h). Does nothing at all if x + w > 0x400 or y + h > 0x200. Otherwise copies h rows of w*2 bytes from pixels into a 16-bit 1024 x 512 buffer at 0x6C9F44, row stride 0x800 bytes, destination (y*1024 + x)*2 - a shadow of PSX VRAM - then calls 0x59E700(rect, 0). The PC counterpart of the PSX LoadImage(RECT*, u_long*). Its neighbour 0x59EB00 is the same with a row-by-row compare first."
note = "0x59E700(rect, mode) walks the 32 PSX-style texture pages (64 x 256 each, 16 across, 2 down), IntersectRect (USER32, import slot 0x5C4168) against the rect, and for each touched page visits 32 cache entries of 0x18 bytes in a table at 0x6C3F40 (32 pages x 32 = 1024 entries, ending 4 bytes short of the VRAM shadow): mode 0 calls Release (vtable +8) on the two COM pointers at entry +0x10 and +0x14 and zeroes the entry; mode non-zero only turns state 1 into state 2. So textures are built lazily from the VRAM shadow and thrown away when the VRAM under them changes."

