evidence = "disasm 2026-09-21, cdecl, no arguments, 0x98 bytes, every jump internal. If byte +0x24 of Sprite_Current has bit 0x20: n = Sprite_ObjectByHandle(byte +0x18). Otherwise n = Sprite_FindNearby(), and 0xFF returns at once. Then n compared signed with 0x1E: below, the u16 at 0x7DEEB2 + n * 0xA4 (Sprite_Objects +0x32); else at 0x802032 + (n - 0x1E) * 0xA4 (Sprite_ObjectsExtra +0x32) - stored to Sprite_Current +0x32. The attached path does not test for 0xFF. Callers 0x588F20, 0x57B830. Call trace all_b: 74,397 calls."
