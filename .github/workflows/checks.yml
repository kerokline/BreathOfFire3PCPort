# Repository checks that read only the repository and no game data.
#
#   tools/ledger_check.py   the divergence ledger (CLAUDE.md rule 2), the
#                           symbols.toml impl lines against the detours in src/,
#                           and rule 4's stub markers
#   tools/ledger_switches.py
#     --check               the switch inventory the ledger's Switch: and
#                           Player: lines are checked against still finds every
#                           kind of name in src/; the exe host and the launcher
#                           refuse the same hosted-only switches
#   tools/ledger_registry.py
#     --check               src/launcher/ledger_registry.h, the launcher's
#                           table of the ledger's switch fields, is what
#                           docs/DIVERGENCE.md gives today (regenerated to
#                           memory and compared)
#   tools/gen_symbols.py    symbols.toml parses and generates (names, addresses,
#                           signatures, impl files) - the same step the build
#                           runs, here without waiting for a toolchain
#   tools/tables.py check   the table catalog: every table's symbol and build
#                           exist, every field fits its record, nothing overlaps
#                           unmarked, every claimed field cites its reader
#   tools/type1.py selftest the type-1 decompressor on synthetic input
#   tools/importer.py check the importer's recipes against fixtures/ (with
#                           seq.py's round trip and fixtures/bgm.tsv's shape)
#                           and exe_tables.py check
#   tools/exe_own.py check  exe_own.cpp's regions well-formed, its generated
#                           name lists equal to recipes/pc-zh*.toml's
#   tools/exe_scan.py       every `gap` row of recipes/exe-gaps.tsv accounted in
#     --accepted            recipes/exe-gaps-accepted.tsv (one answer and its
#                           evidence each) and no accepted row without its gap
#                           (docs/exe-gap-round.md 4, group AC)
#   tools/data_diff.py      recipes/data-diff.tsv (the disc-built images'
#     check                 decoded tables against the PC's, docs/data-diff.md):
#                           every row listed in recipes/data-known.toml, no
#                           entry stale, made from recipes/exe.toml's images
#                           and today's views; the decoders' self-test
#   tools/data_census.py    the raw data accesses in src/ (global by at::
#     --check               or module constant, record by pointer + offset,
#                           raw address)
#                           no more than analysis/data_census.tsv's committed
#                           count (docs/typed-data-census.md)
#     --strict              and every one in src/game a row of
#                           analysis/typed_left.tsv with a reason, no listed
#                           src/game key stale (docs/typed-data-census.md 3)
#   tools/reloc_census.py   the relocation census's gated counts may not rise
#     --check               (analysis/reloc_census.tsv)
#   tools/reloc_bare.py     no new bare image address in src/game, src/input,
#     --check               src/render - a literal in the linked span, a VA in
#                           a non-placing accessor, a code VA cast to a
#                           function pointer or handed to Task_Create without
#                           Img / Code / CodePlace - beyond the ones
#                           analysis/reloc_bare.tsv lists
#                           (docs/relocatable-image-round.md 5)
#   tools/bgm/host         the SPU model's and the sequencer's unit tests
#                           (spu_tests, seq_tests) on synthetic samples and songs
#   tools/lift/selftest.sh  the x86 -> C lifter prototype against its
#                           synthetic corpus, with its negative controls
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ledgers:
    name: Ledgers and symbols
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Divergence and ownership ledgers
        run: python tools/ledger_check.py --verbose

      - name: The switch inventory the ledger's fields are checked against
        run: python tools/ledger_switches.py --check

      - name: The launcher's table of the ledger's switch fields is generated from today's ledger
        run: python tools/ledger_registry.py --check

      - name: symbols.toml generates
        run: python tools/gen_symbols.py --toml symbols.toml --out "$RUNNER_TEMP/symbols.gen.h"

      - name: tables.toml against symbols.toml and fixtures.toml
        run: python tools/tables.py check

      - name: The type-1 decompressor's self-test (no game data)
        run: python tools/type1.py selftest

      - name: The language converters' self-test (no game data)
        run: python tools/loc_build.py selftest

      - name: The importer's recipe against fixtures/ (no game data)
        run: python tools/importer.py check

      - name: The engine's own .data regions and their names against the recipes (no game data)
        run: python tools/exe_own.py check

      - name: Every gap of the disc-built image accounted, the list in step with the gaps (no game data)
        run: python tools/exe_scan.py --accepted

      - name: The disc-built image's data diff, every row known, made from today's recipe (no game data)
        run: python tools/data_diff.py check

      - name: The typed-data census's raw site count may not rise (no game data)
        run: python tools/data_census.py --check

      - name: Every raw data site in src/game is listed with a reason (no game data)
        run: python tools/data_census.py --strict

      - name: The relocation census's gated site counts may not rise (no game data)
        run: python tools/reloc_census.py --check

      - name: No new bare image address in src/game, src/input, src/render (no game data)
        run: python tools/reloc_bare.py --check

  music-host:
    # The SPU model and libsnd's sequencer (src/audio/) built with the system
    # compiler and unit-tested on synthetic samples and songs - no game data
    # (tools/bgm/host/README.md, docs/spu-model.md, docs/libsnd-reading.md).
    name: Music host suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S tools/bgm/host -B "$RUNNER_TEMP/bgm-host"
          cmake --build "$RUNNER_TEMP/bgm-host" -j 4

      - name: spu_tests
        run: '"$RUNNER_TEMP/bgm-host/spu_tests"'

      - name: seq_tests
        run: '"$RUNNER_TEMP/bgm-host/seq_tests"'

  lifter:
    # The x86 -> C lifter prototype (docs/lifter-feasibility.md): lift the
    # synthetic corpus, fuzz it against the original bytes in Unicorn, and
    # check every negative control is refused. Synthetic code only.
    name: Lifter prototype self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install clang, lld, capstone, unicorn
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm
          python -m pip install --quiet capstone unicorn

      - name: Self-test
        run: sh tools/lift/selftest.sh "$RUNNER_TEMP/lift" 100
