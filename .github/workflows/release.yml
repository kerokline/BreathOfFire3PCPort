# Cut a release when a tag v* is pushed: build the engine as build.yml does,
# lay out the player's zip with tools/make_release.py (the launcher, the DLL,
# bof3x.exe and a bundled Python importer; no game data, which the script
# checks), and attach it to a DRAFT pre-release. Publishing stays the owner's
# click on GitHub (docs/releases/README.md). A second zip, -win-x64, holds
# the 64-bit developer build of the same three binaries
# (docs/x64-build-round.md 6); the 32-bit zip stays the player's default.
#
# The release notes are docs/releases/<tag>.md, written before the tag is
# pushed; the job stops if that file is missing.
#
# A push to main builds the same zips as "latest" (the owner, 2026-10-15: easy
# to install current builds): the `latest` tag moves to that commit and the
# published pre-release "latest" gets the new zips, always at
# releases/download/latest/bof3x-latest-win.zip (and -win-x64.zip). It is
# never marked GitHub's latest release, so a published v* release keeps that.
#
# The Linux tarball (docs/linux-round.md, groups D1 and D2): job `linux`
# builds it beside the zips on ubuntu-24.04 with D1's script
# (.github/scripts/linux-build.sh, as build.yml's linux-x86_64 job) and
# tools/make_release.py --linux and hands bof3x-<tag>-linux-x86_64.tar.gz to
# the `release` job as an artifact; that job needs `linux`, so it starts when
# the tarball is made and puts it on the release with the zips (the draft, or
# "latest"). Signed by a build attestation, not by Authenticode: jsign signs
# Windows files, and Linux has no check of that kind. Job `linux` attests the
# tarball with actions/attest (a Sigstore signature that says this repository's
# release workflow built this file at this commit; `gh attestation verify`
# checks it, docs/releases/README.md "Signing"). A Linux failure
# blocks the release as a Windows one does (the owner, 2026-11-22): the
# `release` job is skipped, no draft is made and "latest" keeps the files of
# the last good run. Job `publish` makes the draft or replaces "latest", and
# a newer push does not cancel it (2026-11-23). The cost is time: the zips are built after the Linux
# build, not beside it. DXVK-native is built from its
# pinned source in every release run, with no DXVK cache, so the notices
# make_release.py copies come from the tree the libraries were built from.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build a draft release for (e.g. v0.1.0-alpha.1)"
        required: true

permissions:
  contents: write

# Concurrency is per job, not for the workflow: the two build jobs share a
# group that a newer push to main cancels (a tag's never), and job `publish`
# has a group that never cancels (below).

env:
  # Keep in step with build.yml (docs/SCAFFOLDING.md section 4).
  LLVM_MINGW_TAG: "20260616"
  LLVM_MINGW_CRT: ucrt

jobs:
  release:
    name: ${{ github.ref_type == 'branch' && 'Latest build' || 'Draft release' }}
    # The tarball first: a failed Linux build skips this job (no release).
    needs: [linux]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type == 'branch' }}
    steps:
      - name: The tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = branch ]; then
            # main: the zip is named latest, its README carries the commit
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "VERSION=latest-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
            echo "REF=$GITHUB_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) echo "::error::not a release tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "REF=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Release notes exist
        if: env.TAG != 'latest'
        run: |
          test -f "docs/releases/$TAG.md" || {
            echo "::error file=docs/releases/README.md::docs/releases/$TAG.md is missing - write the notes, then tag"
            exit 1; }

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw \
            -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain on PATH
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/i686-w64-mingw32-clang++" --version
          "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-clang++" --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure
        # The tag goes into every binary's ProductVersion (src/version.rc).
        run: cmake --preset i686 -DBOF3X_VERSION_TAG="$VERSION"

      - name: Build
        run: cmake --build build

      # The 64-bit developer build (docs/x64-build-round.md 6): the same
      # source with the x86_64 preset, in build-x86_64. Built before the
      # signing step so one jsign call signs both widths.
      - name: Configure x86_64
        run: cmake --preset x86_64 -DBOF3X_VERSION_TAG="$VERSION"

      - name: Build x86_64
        run: cmake --build build-x86_64

      # The importer's checks, as checks.yml runs them: the release bundles it.
      - name: The importer's recipes against fixtures/ (no game data)
        run: python tools/importer.py check

      # The debug information out of the downloads and into a symbols zip per
      # build (2026-11-23, docs/releases/README.md "Symbols"): the presets build
      # RelWithDebInfo, and the DWARF was three quarters of bof3x.dll and of the
      # launcher. tools/strip_symbols.py keeps each binary as built in
      # bof3x-<tag>-win[-x64]-symbols.zip, then strips the build's file. Before
      # the signing: a strip after Authenticode breaks the signature.
      # make_release.py refuses a binary that still holds debug sections.
      - name: Keep the symbols, strip the binaries
        run: |
          set -euo pipefail
          python tools/strip_symbols.py --build build --out "build/release/bof3x-$TAG-win-symbols.zip"
          python tools/strip_symbols.py --build build-x86_64 --out "build/release/bof3x-$TAG-win-x64-symbols.zip"
          echo "SYMBOLS=build/release/bof3x-$TAG-win-symbols.zip build/release/bof3x-$TAG-win-x64-symbols.zip build/release/bof3x-$TAG-linux-x86_64-symbols.zip" >> "$GITHUB_ENV"

      # Authenticode (2026-10-16, docs/releases/README.md "Signing"): the three
      # binaries of each width are signed with the owner's Azure Trusted
      # Signing identity by jsign, which signs that service's files from Linux
      # - Microsoft's own action needs a Windows runner, and this job builds on
      # Ubuntu. jsign reads AZURE_TENANT_ID / AZURE_CLIENT_ID /
      # AZURE_CLIENT_SECRET from the environment and timestamps automatically
      # (the certificates live three days). Account, profile and endpoint are
      # repository variables; the secrets are the App Registration's. Without
      # the secrets (a fork) the build ships unsigned, and the log says so.
      - name: Signing identity present?
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then echo "SIGN=1" >> "$GITHUB_ENV"
          else echo "::warning::AZURE_CLIENT_ID is not set: this build ships unsigned"; fi

      - name: Sign the binaries
        if: env.SIGN == '1'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          JSIGN_VERSION: "7.6"
        run: |
          set -euo pipefail
          for v in SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          sha256sum "jsign-$JSIGN_VERSION.jar"
          cd "$GITHUB_WORKSPACE"
          java -jar "$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar" \
            --storetype TRUSTEDSIGNING \
            --keystore "$SIGNING_ENDPOINT" \
            --alias "$SIGNING_ACCOUNT/$SIGNING_PROFILE" \
            --alg SHA-256 \
            --name "bof3x - Breath of Fire III PC" \
            --url "https://github.com/kerokline/BreathOfFire3PCPort" \
            build/bof3x.exe build/bof3x.dll build/bof3x-launcher.exe \
            build-x86_64/bof3x.exe build-x86_64/bof3x.dll build-x86_64/bof3x-launcher.exe

      # The signed executables against the layout again: make_exe.py accepts
      # a certificate table that is exactly the file's trailing blob and
      # reports it signed (docs/state3-build.md 2.1). The 64-bit one is a
      # PE32+ (--width 64), the same layout.
      - name: Verify the signed executables' layout
        if: env.SIGN == '1'
        run: |
          set -euo pipefail
          for b in build:32 build-x86_64:64; do
            dir="${b%:*}"; width="${b#*:}"
            ver="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' "$dir/CMakeCache.txt")"
            python tools/make_exe.py --layout src/hook/exe_layout.h --out "$dir/bof3x.exe" --dll "$dir/bof3x.dll" \
              --version "$ver" --version-tag "$VERSION" --width "$width" --verify-only | tee verify.txt
            grep -q 'signed (certificate table present)' verify.txt
          done

      # Two zips: -win is the player's default (the 32-bit build), -win-x64
      # the 64-bit developer build. Same layout, same bundled importer.
      - name: Lay out the release zips
        run: |
          set -euo pipefail
          python tools/make_release.py --version "$VERSION" --build build --out "build/release/bof3x-$TAG-win.zip"
          python tools/make_release.py --version "$VERSION" --build build-x86_64 --out "build/release/bof3x-$TAG-win-x64.zip"

      # The furigana readings as the project's first mod (docs/mods.md; the
      # reading-row round): a zip of mod.toml and data/furigana/readings.toml,
      # added on the launcher's Mods tab. Made only once data/furigana/ exists
      # (the round's group FB writes it); the mod tools' self-tests run first.
      - name: The furigana mod zip
        run: |
          set -euo pipefail
          python tools/mods.py selftest
          python tools/make_mod.py --selftest
          python tools/table_edit_build.py selftest
          python tools/disc_patch_build.py selftest
          if [ -f data/furigana/readings.toml ]; then
            ver="$(python tools/make_mod.py furigana --version-of)"
            python tools/make_mod.py furigana --out "build/release/furigana-$ver.zip"
            echo "MOD_ZIPS=build/release/furigana-$ver.zip" >> "$GITHUB_ENV"
          else
            echo "data/furigana/readings.toml is not in this commit: no furigana mod zip"
          fi

      # The tarball job `linux` made and its symbols zip, beside the zips.
      - name: Fetch the Linux tarball
        uses: actions/download-artifact@v8
        with:
          name: linux-tarball
          path: build/release

      - name: The Linux tarball is there
        run: |
          set -euo pipefail
          test -s "build/release/bof3x-$TAG-linux-x86_64.tar.gz"
          tar -tzf "build/release/bof3x-$TAG-linux-x86_64.tar.gz" > /dev/null
          for z in $SYMBOLS; do test -s "$z"; python -m zipfile -l "$z" > /dev/null; done

      # The files to job `publish`, which a newer push does not cancel.
      - name: Hand the files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/release/*.zip
            build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The Linux tarball, built before the `release` job, which needs it.
  linux:
    name: ${{ github.ref_type == 'branch' && 'Latest build' || 'Draft release' }} (Linux tarball)
    runs-on: ubuntu-24.04
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref_type == 'branch' }}
    # This job's own permissions (they replace the workflow's): the checkout,
    # and what actions/attest needs to sign and store the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: The tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = branch ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "VERSION=latest-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
            echo "REF=$GITHUB_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) echo "::error::not a release tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "REF=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the build's packages (meson, glslang, ccache, SDL3's headers)
        run: .github/scripts/linux-build.sh deps

      # No DXVK cache here (build.yml's job has one): BOF3X_DXVK_LIBDIR stays
      # empty, so cmake/dxvk_native.cmake builds DXVK-native from the pinned
      # commit and make_release.py takes its notices from that tree (it refuses
      # a build configured with BOF3X_DXVK_LIBDIR). The tag goes into the ELF
      # (src/version.h.in), as into the Windows binaries; make_release.py
      # --linux refuses a build whose tag is not the release's.
      - name: Configure
        env:
          BOF3X_DXVK_LIBDIR: ""
          BOF3X_VERSION_TAG: ${{ env.VERSION }}
        run: .github/scripts/linux-build.sh configure

      - name: Build
        run: .github/scripts/linux-build.sh build

      - name: Check the ELFs and their libraries
        run: .github/scripts/linux-build.sh check

      # As the Windows job does: the five files as built into the symbols zip,
      # then stripped of their debug sections (the GNU build id stays; the
      # log's "build:" line prints it).
      - name: Keep the symbols, strip the binaries
        run: |
          python tools/strip_symbols.py --linux --build build-linux-x86_64 \
            --out "build/release/bof3x-$TAG-linux-x86_64-symbols.zip"

      # The ELF, the launcher, the three libraries, the importer and its data,
      # the notices; no Python and no game data (the script checks).
      - name: Lay out the tarball
        run: |
          set -euo pipefail
          python tools/make_release.py --linux --version "$VERSION" --build build-linux-x86_64 \
            --out "build/release/bof3x-$TAG-linux-x86_64.tar.gz"
          tar -tvzf "build/release/bof3x-$TAG-linux-x86_64.tar.gz" | awk '$1 ~ /^-rwx/ {print $1, $6}'

      # The tarball's signature (the owner, 2026-11-22): a SLSA build
      # provenance attestation over the file's sha256, signed with a Sigstore
      # certificate issued to this workflow run and kept by GitHub for the
      # repository. A player checks a download with
      #   gh attestation verify bof3x-<tag>-linux-x86_64.tar.gz --repo <owner>/<repository>
      # A failure here fails the job, so no release goes out with an unsigned
      # tarball.
      - name: Attest the tarball
        uses: actions/attest@v4
        with:
          subject-path: build/release/bof3x-${{ env.TAG }}-linux-x86_64.tar.gz

      # A .tar.gz keeps the files' modes inside it; the artifact's own zip
      # only carries it to the next job.
      - name: Hand the tarball to the release job
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: |
            build/release/bof3x-${{ env.TAG }}-linux-x86_64.tar.gz
            build/release/bof3x-${{ env.TAG }}-linux-x86_64-symbols.zip
          if-no-files-found: error
          retention-days: 7

  # The release itself (2026-11-23): the draft, or "latest". A job of its own
  # so that a newer push to main does not cancel it part-way - the tag moved
  # and the files not yet replaced, or some of the files new and some old. The
  # two jobs before it are the ones a newer push cancels (their concurrency
  # group); this one's group never cancels, so a publish that began ends, and
  # the newer run's publish waits for it.
  publish:
    name: ${{ github.ref_type == 'branch' && 'Latest build' || 'Draft release' }} (publish)
    needs: [release]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: The tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = branch ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "REF=$GITHUB_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) echo "::error::not a release tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "REF=$tag" >> "$GITHUB_ENV"

      # For the notes file and the push of the latest tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Fetch the files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: build/release

      - name: The files are there
        run: |
          set -euo pipefail
          ls -l build/release
          symbols=""
          for f in "bof3x-$TAG-win.zip" "bof3x-$TAG-win-x64.zip" "bof3x-$TAG-linux-x86_64.tar.gz"; do
            test -s "build/release/$f"
          done
          for f in "bof3x-$TAG-win-symbols.zip" "bof3x-$TAG-win-x64-symbols.zip" "bof3x-$TAG-linux-x86_64-symbols.zip"; do
            test -s "build/release/$f"
            symbols="$symbols build/release/$f"
          done
          echo "SYMBOLS=$symbols" >> "$GITHUB_ENV"
          echo "MOD_ZIPS=$(ls build/release/furigana-*.zip 2>/dev/null | tr '\n' ' ' || true)" >> "$GITHUB_ENV"

      # A run that waited may be older than what "latest" holds by now (its
      # build ended after a newer run's publish): it does not put its files
      # back. GitHub's compare of the latest tag with this commit says
      # "behind" then. No latest tag yet (the first run): the call fails, and
      # the run publishes.
      - name: Is a newer build on "latest" already?
        if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/latest...$GITHUB_SHA" --jq .status 2>/dev/null)" || status=none
          echo "this commit against the latest tag: $status"
          if [ "$status" = behind ]; then
            echo "::notice::\"latest\" already holds a newer commit than ${GITHUB_SHA::8}: not published"
            echo "STALE=1" >> "$GITHUB_ENV"
          fi

      - name: Draft pre-release
        if: env.TAG != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "build/release/bof3x-$TAG-win.zip" "build/release/bof3x-$TAG-win-x64.zip" \
            "build/release/bof3x-$TAG-linux-x86_64.tar.gz" ${MOD_ZIPS:-} $SYMBOLS \
            --draft --prerelease --verify-tag \
            --title "Breath of Fire III - bof3x $TAG" \
            --notes-file "docs/releases/$TAG.md"

      # main: the files replaced, then the latest tag moved to this commit, then
      # the notes naming the commit - in that order, so a step that fails at an
      # upload leaves the tag and the notes with the files of the last build.
      # Published, not a draft: this is the download link.
      - name: Latest pre-release
        if: env.TAG == 'latest' && env.STALE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/latest.md"
          {
            echo "**The current build of \`main\`** - commit ${GITHUB_SHA::8}, built $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "Replaced on every push to main: not a release, not checked by hand. For a release, take a"
            echo "\`v*\` one. The zip holds no game data: unzip it into a folder with a short path, run"
            echo "\`bof3x-launcher.exe\` and add your own copy of the game on the Sources page"
            echo "(docs/releases/README.md; the latest release's notes say more). Take"
            echo "\`bof3x-latest-win.zip\`: it is the 32-bit build, the default. \`bof3x-latest-win-x64.zip\`"
            echo "is the 64-bit developer build of the same files; both use the same game copy."
            echo
            echo "Linux (x86_64): \`bof3x-latest-linux-x86_64.tar.gz\`. Unpack it and run \`./bof3x-launcher\`."
            echo "It needs Python 3 and a Vulkan 1.3 driver from the system (README, the Linux section)."
            echo
            echo "The files with \`-symbols.zip\` in the name are for developers. They hold the debug"
            echo "information of the programs. You do not need them to play."
          } > "$notes"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "build/release/bof3x-latest-win.zip" "build/release/bof3x-latest-win-x64.zip" \
              "build/release/bof3x-latest-linux-x86_64.tar.gz" ${MOD_ZIPS:-} $SYMBOLS --clobber
            git tag -f latest "$GITHUB_SHA"
            git push -f origin latest
            gh release edit latest --prerelease --latest=false --title "Latest build (main)" --notes-file "$notes"
          else
            git tag -f latest "$GITHUB_SHA"
            git push -f origin latest
            gh release create latest "build/release/bof3x-latest-win.zip" "build/release/bof3x-latest-win-x64.zip" \
              "build/release/bof3x-latest-linux-x86_64.tar.gz" ${MOD_ZIPS:-} $SYMBOLS \
              --prerelease --latest=false --verify-tag --title "Latest build (main)" --notes-file "$notes"
          fi
