# Cut a release when a tag v* is pushed: build the engine as build.yml does,
# lay out the player's zip with tools/make_release.py (the launcher, the DLL,
# bof3x.exe and a bundled Python importer; no game data, which the script
# checks), and attach it to a DRAFT pre-release. Publishing stays the owner's
# click on GitHub (docs/releases/README.md).
#
# The release notes are docs/releases/<tag>.md, written before the tag is
# pushed; the job stops if that file is missing.
#
# A push to main builds the same zip as "latest" (the owner, 2026-10-15: easy
# to install current builds): the `latest` tag moves to that commit and the
# published pre-release "latest" gets the new zip, always at
# releases/download/latest/bof3x-latest-win.zip. It is never marked GitHub's
# latest release, so a published v* release keeps that.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build a draft release for (e.g. v0.1.0-alpha.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # a newer push to main supersedes a latest build still running; a tag's never
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  # Keep in step with build.yml (docs/SCAFFOLDING.md section 4).
  LLVM_MINGW_TAG: "20260616"
  LLVM_MINGW_CRT: ucrt

jobs:
  release:
    name: ${{ github.ref_type == 'branch' && 'Latest build' || 'Draft release' }}
    runs-on: ubuntu-24.04
    steps:
      - name: The tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = branch ]; then
            # main: the zip is named latest, its README carries the commit
            echo "TAG=latest" >> "$GITHUB_ENV"
            echo "VERSION=latest-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
            echo "REF=$GITHUB_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in v*) ;; *) echo "::error::not a release tag: $tag"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "REF=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Release notes exist
        if: env.TAG != 'latest'
        run: |
          test -f "docs/releases/$TAG.md" || {
            echo "::error file=docs/releases/README.md::docs/releases/$TAG.md is missing - write the notes, then tag"
            exit 1; }

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw \
            -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain on PATH
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/i686-w64-mingw32-clang++" --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure
        # The tag goes into every binary's ProductVersion (src/version.rc).
        run: cmake --preset i686 -DBOF3X_VERSION_TAG="$VERSION"

      - name: Build
        run: cmake --build build

      # The importer's checks, as checks.yml runs them: the release bundles it.
      - name: The importer's recipes against fixtures/ (no game data)
        run: python tools/importer.py check

      # Authenticode (2026-10-16, docs/releases/README.md "Signing"): the three
      # binaries are signed with the owner's Azure Trusted Signing identity by
      # jsign, which signs that service's files from Linux - Microsoft's own
      # action needs a Windows runner, and this job builds on Ubuntu. jsign
      # reads AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET from the
      # environment and timestamps automatically (the certificates live three
      # days). Account, profile and endpoint are repository variables; the
      # secrets are the App Registration's. Without the secrets (a fork) the
      # build ships unsigned, and the log says so.
      - name: Signing identity present?
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then echo "SIGN=1" >> "$GITHUB_ENV"
          else echo "::warning::AZURE_CLIENT_ID is not set: this build ships unsigned"; fi

      - name: Sign the binaries
        if: env.SIGN == '1'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          JSIGN_VERSION: "7.6"
        run: |
          set -euo pipefail
          for v in SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          sha256sum "jsign-$JSIGN_VERSION.jar"
          cd "$GITHUB_WORKSPACE"
          java -jar "$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar" \
            --storetype TRUSTEDSIGNING \
            --keystore "$SIGNING_ENDPOINT" \
            --alias "$SIGNING_ACCOUNT/$SIGNING_PROFILE" \
            --alg SHA-256 \
            --name "bof3x - Breath of Fire III PC" \
            --url "https://github.com/kerokline/BreathOfFire3PCPort" \
            build/bof3x.exe build/bof3x.dll build/bof3x-launcher.exe

      # The signed executable against the layout again: make_exe.py accepts
      # a certificate table that is exactly the file's trailing blob and
      # reports it signed (docs/state3-build.md 2.1).
      - name: Verify the signed executable's layout
        if: env.SIGN == '1'
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          python tools/make_exe.py --layout src/hook/exe_layout.h --out build/bof3x.exe --dll build/bof3x.dll \
            --version "$ver" --version-tag "$VERSION" --verify-only | tee verify.txt
          grep -q 'signed (certificate table present)' verify.txt

      - name: Lay out the release zip
        run: python tools/make_release.py --version "$VERSION" --build build --out "build/release/bof3x-$TAG-win.zip"

      # The furigana readings as the project's first mod (docs/mods.md; the
      # reading-row round): a zip of mod.toml and data/furigana/readings.toml,
      # added on the launcher's Mods tab. Made only once data/furigana/ exists
      # (the round's group FB writes it); the mod tools' self-tests run first.
      - name: The furigana mod zip
        run: |
          set -euo pipefail
          python tools/mods.py selftest
          python tools/make_mod.py --selftest
          if [ -f data/furigana/readings.toml ]; then
            ver="$(python tools/make_mod.py furigana --version-of)"
            python tools/make_mod.py furigana --out "build/release/furigana-$ver.zip"
            echo "MOD_ZIPS=build/release/furigana-$ver.zip" >> "$GITHUB_ENV"
          else
            echo "data/furigana/readings.toml is not in this commit: no furigana mod zip"
          fi

      - name: Draft pre-release
        if: env.TAG != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "build/release/bof3x-$TAG-win.zip" ${MOD_ZIPS:-} \
            --draft --prerelease --verify-tag \
            --title "Breath of Fire III - bof3x $TAG" \
            --notes-file "docs/releases/$TAG.md"

      # main: the latest tag moved to this commit, the zip replaced, the notes
      # naming the commit. Published, not a draft: this is the download link.
      - name: Latest pre-release
        if: env.TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          notes="$RUNNER_TEMP/latest.md"
          {
            echo "**The current build of \`main\`** - commit ${GITHUB_SHA::8}, built $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "Replaced on every push to main: not a release, not checked by hand. For a release, take a"
            echo "\`v*\` one. The zip holds no game data: unzip it into a folder with a short path, run"
            echo "\`bof3x-launcher.exe\` and add your own copy of the game on the Sources page"
            echo "(docs/releases/README.md; the latest release's notes say more)."
          } > "$notes"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "build/release/bof3x-latest-win.zip" ${MOD_ZIPS:-} --clobber
            gh release edit latest --prerelease --latest=false --title "Latest build (main)" --notes-file "$notes"
          else
            gh release create latest "build/release/bof3x-latest-win.zip" ${MOD_ZIPS:-} --prerelease --latest=false \
              --verify-tag --title "Latest build (main)" --notes-file "$notes"
          fi
