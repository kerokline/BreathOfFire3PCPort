# Build bof3x.dll, bof3x.exe and bof3x-launcher.exe on every push to main and every pull
# request, with the project's one supported toolchain (docs/SCAFFOLDING.md
# section 4): llvm-mingw, pinned to the release the build is verified with,
# in both widths. The i686 job is the player's build; the x86_64 job
# (docs/x64-build-round.md 3 "XA4") is the developer's 64-bit build, the same
# source with the x86_64 preset. Both must pass: each links its three
# binaries, checks their imports and uploads them. Cross-compiled on Linux:
# the toolchain is the same, and the runner is faster to start.
#
# The build reads no game data (CMakeLists.txt), so a hosted runner is enough.
# Nothing here runs the game; the checks that need BOF3.exe stay on the
# owner's machine.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # docs/SCAFFOLDING.md section 4: "Verified with llvm-mingw 20260616".
  # Change both together.
  LLVM_MINGW_TAG: "20260616"
  # llvm-mingw ships a ucrt and an msvcrt flavour; ucrt is its default.
  LLVM_MINGW_CRT: ucrt

jobs:
  i686:
    name: i686 (llvm-mingw)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Matched by pattern so a change in the Ubuntu base the release is
          # built on does not break the download.
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw \
            -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          ls -l llvm-mingw-*.tar.xz
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain versions
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/i686-w64-mingw32-clang++" --version
          cmake --version | head -1
          ninja --version
          python --version

      - name: Configure
        run: cmake --preset i686

      - name: Build
        run: cmake --build build

      # The DLL is injected by path into a process whose DLL search order we
      # do not control, so it is linked -static (CMakeLists.txt): it may import
      # system DLLs only. Fail if a toolchain runtime DLL or SDL3.dll crept in.
      # bof3x.exe (tools/make_exe.py, docs/state3-design.md section 6.4) imports
      # exactly two: KERNEL32.dll and bof3x.dll, the one non-system DLL allowed,
      # found beside it by the loader. The build has already verified its
      # section table (make_exe.py), so a wrong layout fails before this step.
      - name: Check imports
        run: |
          set -euo pipefail
          readobj="$LLVM_MINGW_ROOT/bin/llvm-readobj"
          fail=0
          for f in build/bof3x.dll build/bof3x-launcher.exe build/bof3x.exe; do
            echo "== $f"
            "$readobj" --file-headers "$f" | grep -E '^\s*(Format|Arch):'
            "$readobj" --coff-imports "$f" | sed -n 's/^ *Name: \(.*\.dll\)$/\1/Ip' | sort -uf | tee imports.txt
            if [ "$f" = build/bof3x.exe ]; then
              if [ "$(tr 'A-Z' 'a-z' < imports.txt | tr '\n' ' ')" != "bof3x.dll kernel32.dll " ]; then
                echo "::error file=tools/make_exe.py::$f must import KERNEL32.dll and bof3x.dll alone (above)"
                fail=1
              fi
            elif grep -iE '^(lib.*|sdl3|bof3x)\.dll$' imports.txt; then
              echo "::error file=CMakeLists.txt::$f imports a non-system DLL (above); it must link -static"
              fail=1
            fi
          done
          exit $fail

      # Our own binaries, built from this repository and SDL3 (zlib licence,
      # docs/THIRD_PARTY.md). No game data is in the build tree.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bof3x-i686-${{ github.sha }}
          path: |
            build/bof3x.dll
            build/bof3x-launcher.exe
            build/bof3x.exe
          if-no-files-found: error
          retention-days: 14

  # The 64-bit build (docs/x64-build-round.md 3 "XA4"; stage D made it a
  # gate): the same toolchain tarball (its x86_64-w64-mingw32-* drivers sit
  # beside the i686 ones, so the cache key is the i686 job's), the x86_64
  # preset. It builds bof3x.dll without the hosted mode and the fuzz,
  # bof3x.exe as a PE32+ (tools/make_exe.py --width 64) and the player's
  # launcher; no bof3x-launcher-dev.exe (CMakeLists.txt, BOF3X_HOSTED_BUILD).
  # The release carries it as a second zip beside the 32-bit one, which stays
  # the player's default (release.yml).
  x86_64:
    name: x86_64 (llvm-mingw)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw             -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          ls -l llvm-mingw-*.tar.xz
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain versions
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-clang++" --version
          cmake --version | head -1
          ninja --version
          python --version

      - name: Configure
        run: cmake --preset x86_64

      - name: Build
        run: cmake --build build-x86_64

      # The i686 job's check for the 64-bit files: the DLL and the launcher
      # import system DLLs only (-static), bof3x.exe exactly KERNEL32.dll and
      # bof3x.dll. llvm-readobj prints "Format: COFF-x86-64" and "Arch:
      # x86_64" for a PE32+ (measured 2026-11-07 on build-x86_64/bof3x.exe;
      # the i686 job's files say "Arch: i386"), and the check fails if any of
      # the three is not that: a 32-bit file in the 64-bit tree would mean
      # the preset took the wrong drivers.
      - name: Check imports
        run: |
          set -euo pipefail
          readobj="$LLVM_MINGW_ROOT/bin/llvm-readobj"
          fail=0
          for f in build-x86_64/bof3x.dll build-x86_64/bof3x-launcher.exe build-x86_64/bof3x.exe; do
            echo "== $f"
            "$readobj" --file-headers "$f" | grep -E '^\s*(Format|Arch):' | tee headers.txt
            if ! grep -qE '^\s*Arch: x86_64$' headers.txt; then
              echo "::error file=CMakePresets.json::$f is not an x86_64 image (above)"
              fail=1
            fi
            "$readobj" --coff-imports "$f" | sed -n 's/^ *Name: \(.*\.dll\)$/\1/Ip' | sort -uf | tee imports.txt
            if [ "$f" = build-x86_64/bof3x.exe ]; then
              if [ "$(tr 'A-Z' 'a-z' < imports.txt | tr '\n' ' ')" != "bof3x.dll kernel32.dll " ]; then
                echo "::error file=tools/make_exe.py::$f must import KERNEL32.dll and bof3x.dll alone (above)"
                fail=1
              fi
            elif grep -iE '^(lib.*|sdl3|bof3x)\.dll$' imports.txt; then
              echo "::error file=CMakeLists.txt::$f imports a non-system DLL (above); it must link -static"
              fail=1
            fi
          done
          exit $fail

      # Our own binaries, as the i686 job's. No game data is in the build tree.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bof3x-x86_64-${{ github.sha }}
          path: |
            build-x86_64/bof3x.dll
            build-x86_64/bof3x-launcher.exe
            build-x86_64/bof3x.exe
          if-no-files-found: error
          retention-days: 14
