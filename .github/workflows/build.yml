# Build bof3x.dll, bof3x.exe and bof3x-launcher.exe on every push to main and every pull
# request, with the project's one supported toolchain (docs/SCAFFOLDING.md
# section 4): llvm-mingw, pinned to the release the build is verified with,
# in both widths - the i686 job is the player's build and must pass; the
# x86_64 job (docs/x64-build-round.md 3 "XA4") compiles the same source with
# the x86_64 preset and keeps its compile and link logs as an artefact. Until
# the round's stage C links and runs the 64-bit executable, its compile and
# link steps are non-blocking (continue-on-error below): the compile log is
# the asm policy's second opinion (XA3), not a gate. Cross-compiled on Linux:
# the toolchain is the same, and the runner is faster to start.
#
# The build reads no game data (CMakeLists.txt), so a hosted runner is enough.
# Nothing here runs the game; the checks that need BOF3.exe stay on the
# owner's machine.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # docs/SCAFFOLDING.md section 4: "Verified with llvm-mingw 20260616".
  # Change both together.
  LLVM_MINGW_TAG: "20260616"
  # llvm-mingw ships a ucrt and an msvcrt flavour; ucrt is its default.
  LLVM_MINGW_CRT: ucrt

jobs:
  i686:
    name: i686 (llvm-mingw)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Matched by pattern so a change in the Ubuntu base the release is
          # built on does not break the download.
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw \
            -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          ls -l llvm-mingw-*.tar.xz
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain versions
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/i686-w64-mingw32-clang++" --version
          cmake --version | head -1
          ninja --version
          python --version

      - name: Configure
        run: cmake --preset i686

      - name: Build
        run: cmake --build build

      # The DLL is injected by path into a process whose DLL search order we
      # do not control, so it is linked -static (CMakeLists.txt): it may import
      # system DLLs only. Fail if a toolchain runtime DLL or SDL3.dll crept in.
      # bof3x.exe (tools/make_exe.py, docs/state3-design.md section 6.4) imports
      # exactly two: KERNEL32.dll and bof3x.dll, the one non-system DLL allowed,
      # found beside it by the loader. The build has already verified its
      # section table (make_exe.py), so a wrong layout fails before this step.
      - name: Check imports
        run: |
          set -euo pipefail
          readobj="$LLVM_MINGW_ROOT/bin/llvm-readobj"
          fail=0
          for f in build/bof3x.dll build/bof3x-launcher.exe build/bof3x.exe; do
            echo "== $f"
            "$readobj" --file-headers "$f" | grep -E '^\s*(Format|Arch):'
            "$readobj" --coff-imports "$f" | sed -n 's/^ *Name: \(.*\.dll\)$/\1/Ip' | sort -uf | tee imports.txt
            if [ "$f" = build/bof3x.exe ]; then
              if [ "$(tr 'A-Z' 'a-z' < imports.txt | tr '\n' ' ')" != "bof3x.dll kernel32.dll " ]; then
                echo "::error file=tools/make_exe.py::$f must import KERNEL32.dll and bof3x.dll alone (above)"
                fail=1
              fi
            elif grep -iE '^(lib.*|sdl3|bof3x)\.dll$' imports.txt; then
              echo "::error file=CMakeLists.txt::$f imports a non-system DLL (above); it must link -static"
              fail=1
            fi
          done
          exit $fail

      # Our own binaries, built from this repository and SDL3 (zlib licence,
      # docs/THIRD_PARTY.md). No game data is in the build tree.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bof3x-i686-${{ github.sha }}
          path: |
            build/bof3x.dll
            build/bof3x-launcher.exe
            build/bof3x.exe
          if-no-files-found: error
          retention-days: 14

  # The 64-bit build (docs/x64-build-round.md 3 "XA4"): the same toolchain
  # tarball (its x86_64-w64-mingw32-* drivers sit beside the i686 ones, so the
  # cache key is the i686 job's), the x86_64 preset. Three steps after the
  # configure, so the log tells a file that does not compile from a link that
  # does not resolve: the objects alone (CMakeLists.txt's bof3x_compile target,
  # -k 0 so the log is whole), then the link. Both non-blocking until stage C;
  # the configure is not, since it fetches and configures SDL3 for the width.
  # The summary step counts the compile errors by file into the job summary.
  # Stage C: drop the two continue-on-error lines, add the import check.
  x86_64:
    name: x86_64 (llvm-mingw; compile log, link non-blocking until stage C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Cache llvm-mingw
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_TAG }}-${{ env.LLVM_MINGW_CRT }}-ubuntu-x86_64

      - name: Fetch llvm-mingw ${{ env.LLVM_MINGW_TAG }}
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$LLVM_MINGW_TAG" -R mstorsjo/llvm-mingw \
            -p "llvm-mingw-${LLVM_MINGW_TAG}-${LLVM_MINGW_CRT}-ubuntu-*-x86_64.tar.xz"
          ls -l llvm-mingw-*.tar.xz
          sha256sum llvm-mingw-*.tar.xz
          mkdir llvm-mingw
          tar -xf llvm-mingw-*.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw-*.tar.xz

      - name: Toolchain versions
        run: |
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-clang++" --version
          cmake --version | head -1
          ninja --version
          python --version

      # -ferror-limit=0: clang stops a file after 20 errors, and the
      # generated header's static_asserts alone are 19 of them until stage
      # B3 (docs/x64-build-round.md 4), which would hide every file's own
      # errors from the log. Dropped with the continue-on-error lines.
      - name: Configure
        run: cmake --preset x86_64 -DCMAKE_CXX_FLAGS=-ferror-limit=0

      - name: Compile
        id: compile
        continue-on-error: true
        run: |
          set -uo pipefail
          cmake --build build-x86_64 --target bof3x_compile -- -k 0 2>&1 | tee build-x86_64/compile.log
          exit "${PIPESTATUS[0]}"

      - name: Link
        id: link
        continue-on-error: true
        run: |
          set -uo pipefail
          ninja -C build-x86_64 -k 0 2>&1 | tee build-x86_64/link.log
          exit "${PIPESTATUS[0]}"

      - name: Summary
        run: |
          set -uo pipefail
          {
            echo "## x86_64: compile ${{ steps.compile.outcome }}, link ${{ steps.link.outcome }}"
            echo
            echo "Compile errors by file (clang's \`file:line:col: error\` lines, build-x86_64/compile.log):"
            echo
            echo '```'
            grep -oE '^[^: ]+\.(cpp|cc|c|h|hpp|rc):[0-9]+:[0-9]+: (fatal )?error' build-x86_64/compile.log \
              | sed -E 's/:[0-9]+:[0-9]+: (fatal )?error$//' | sort | uniq -c | sort -rn || echo "none"
            echo '```'
            echo
            echo "Link errors (build-x86_64/link.log): $(grep -cE 'ld\.lld: error|undefined symbol' build-x86_64/link.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The logs always; the binaries when the link got that far. No game
      # data is in the build tree.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bof3x-x86_64-${{ github.sha }}
          path: |
            build-x86_64/compile.log
            build-x86_64/link.log
            build-x86_64/bof3x.dll
            build-x86_64/bof3x-launcher.exe
            build-x86_64/bof3x.exe
          if-no-files-found: error
          retention-days: 14
