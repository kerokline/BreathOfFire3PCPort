# Known differences for the static data diff (tools/data_diff.py, docs/data-diff.md):
# each ties rows of recipes/data-diff.tsv - a decoded value of a disc-built .data
# image that is not the PC's - to the reason it may stay. `check` (CI) fails on a
# row no entry matches and on an entry that matches no row (stale: remove it).
# The rule of the file is the A/B/C harness's (recipes/abc-known.toml): **when in
# doubt, unexplained** - an entry names the narrowest builds and keys it can.
#
#   id        a short name
#   kind      "difference": a value the disc placed, not the PC's (the disc's own
#                           data, a release difference) - matches `differ` rows
#             "hole":       a value the PC has and the image leaves zero or
#                           cannot reach, no disc placing it - matches `hole`
#                           rows; listed only while it is tracked to be fixed
#   builds    the builds it holds for (default: every one)
#   keys      fnmatch patterns over the report's keys (family/record/field)
#   reason    why it may stay
#   cite      the ledger entry or measurement that says so
#   tracked   (holes) where the fix is tracked
#
# Keys, ids and reasons only - no value from any table (CLAUDE.md rule 1).

# --- Release differences ------------------------------------------------

[[known]]
id = "psp-exp-table"
kind = "difference"
builds = ["psp-jp", "psp-eu"]
keys = ["exp_table/0629/*", "exp_table/06[3-9][0-9]/*"]
reason = "the PSP rebalanced roster index 6's level table (its rows 594..692; the values differ from row 629 on); a PSP-built image takes BOOT.BIN's rows, the PSP's own data"
cite = "DIV-0104; docs/psp-image.md; tables.toml exp_table psp rows (5295 of 5544 bytes equal)"

[[known]]
id = "psp-consumable-87"
kind = "difference"
builds = ["psp-jp", "psp-eu"]
keys = ["consumables/0087/*"]
reason = "consumable 87's flag byte as the PSP has it (one byte), the PSP's own data"
cite = "DIV-0104; tables.toml consumables psp-jp row (numbers equal in 91 of 92 records, id 87 differs)"

[[known]]
id = "western-rule-rows"
kind = "difference"
builds = ["psx-us", "psx-eu-en", "psx-fr", "psx-de", "psp-eu"]
keys = ["fishing_rule_lines/*/message"]
reason = "the Western discs lay the fishing Rule pages' rows out for their own text (page 1's third line a row lower, page 3 a line after its second, DE also one in page 3's last row); the image takes the disc's layout with its own messages"
cite = "DIV-0101, amended 2026-10-16 (D303, D286); docs/fishing-rule-pages.md"

[[known]]
id = "jp-event-op-15"
kind = "difference"
builds = ["psx-jp"]
keys = ["event_op_lengths/0015/length"]
reason = "the JP disc's entry 15 of the event-script op lengths, which no op below 0xF0 reads (the table is indexed by op >> 4 for ops below 0xF0)"
cite = "tables.toml event_op_lengths psx-jp row (read on the JP disc 2026-10-08: entries 0..14 equal, entry 15 never used)"

